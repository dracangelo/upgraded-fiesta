name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "31 3 * * 1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          check-latest: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: _frontend/package-lock.json
      - name: Verify deterministic offline dashboard bundle
        run: npm --prefix _frontend ci --ignore-scripts && npm --prefix _frontend run check
      - name: Format, vet, and run the complete suite
        run: make fmt-check vet test
      - name: Verify feature status declarations
        run: make feature-status-check
      - name: Verify deterministic native build
        run: make reproducible
      - uses: anchore/sbom-action@v0
        with:
          artifact-name: enumscan-ci-sbom.cdx.json
          format: cyclonedx-json
          output-file: dist/enumscan-ci-sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: ci-release-evidence
          path: dist/
          retention-days: 14

  supported-platform:
    name: Native validation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          check-latest: true
          cache-dependency-path: go.sum
      - name: Run complete tests natively
        run: go test ./...
      - name: Build native binary
        run: go build -trimpath -buildvcs=true -o enumscan${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/enumscan
      - name: Execute native CLI
        shell: bash
        run: ./enumscan${{ runner.os == 'Windows' && '.exe' || '' }} -config configs/example.yaml help

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: enumscan_test
          POSTGRES_USER: enumscan
          POSTGRES_PASSWORD: enumscan-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U enumscan -d enumscan_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          check-latest: true
          cache-dependency-path: go.sum
      - name: Exercise PostgreSQL core migration and evidence lifecycle
        env:
          ENUMSCAN_POSTGRES_TEST_DSN: postgres://enumscan:enumscan-ci-only@localhost:5432/enumscan_test?sslmode=disable
        run: go test ./internal/store -run '^TestPostgresCoreLifecycleIntegration$' -count=1

  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          check-latest: true
      - run: make build-cross
      - uses: actions/upload-artifact@v4
        with:
          name: cross-platform-binaries
          path: dist/enumscan-*
          retention-days: 14

  dependency-review:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  vulnerability-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          check-latest: true
      - name: Go vulnerability database scan
        run: make vulncheck
      - name: Build image without publishing
        run: docker build --pull --tag enumscan:ci .
      - name: Scan filesystem and image
        uses: anchore/scan-action@v7
        with:
          image: enumscan:ci
          fail-build: true
          severity-cutoff: high

  codeql:
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: go
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          check-latest: true
      - run: go build ./cmd/enumscan
      - uses: github/codeql-action/analyze@v4

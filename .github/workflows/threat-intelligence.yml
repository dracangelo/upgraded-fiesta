name: Threat intelligence refresh

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "NVD modification window (1-120 days)"
        required: false
        default: "2"

concurrency:
  group: threat-intelligence-refresh
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build-reviewed-delta:
    if: github.event_name == 'workflow_dispatch' || vars.PRODUCTION_THREAT_INTELLIGENCE == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production-threat-intelligence
      deployment: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test feed transformation
        run: python -m unittest scripts/test_sync_threat_intel.py
      - name: Fetch, merge, and validate authoritative feeds
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          INTEL_DAYS: ${{ inputs.days || '2' }}
        run: |
          mkdir -p dist/threat-intelligence
          python scripts/sync_threat_intel.py \
            --days "$INTEL_DAYS" \
            --output dist/threat-intelligence/enumscan-nvd-delta.json \
            --metadata dist/threat-intelligence/provenance.json
          python -m json.tool dist/threat-intelligence/enumscan-nvd-delta.json >/dev/null
          python -m json.tool dist/threat-intelligence/provenance.json >/dev/null
          sha256sum dist/threat-intelligence/* > dist/threat-intelligence/SHA256SUMS
      - name: Attest feed and provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/threat-intelligence/enumscan-nvd-delta.json
            dist/threat-intelligence/provenance.json
            dist/threat-intelligence/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: enumscan-threat-intelligence-${{ github.run_id }}
          path: dist/threat-intelligence/
          retention-days: 30
          if-no-files-found: error

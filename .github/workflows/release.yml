name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          check-latest: true
      - name: Verify and build reproducibly
        run: make verify
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          artifact-name: enumscan-sbom.cdx.json
          format: cyclonedx-json
          output-file: dist/enumscan-sbom.cdx.json
      - uses: sigstore/cosign-installer@v3
      - name: Keyless-sign release artifacts
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign-blob --yes --bundle dist/enumscan.bundle dist/enumscan
          cosign sign-blob --yes --bundle dist/enumscan-sbom.cdx.json.bundle dist/enumscan-sbom.cdx.json
      - name: Publish signed release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/enumscan
            dist/enumscan.bundle
            dist/enumscan-sbom.cdx.json
            dist/enumscan-sbom.cdx.json.bundle

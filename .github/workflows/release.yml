name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: production-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  supported-platform-validation:
    name: Release validation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          check-latest: true
          cache-dependency-path: go.sum
      - run: go test ./...
      - name: Build and execute native CLI
        shell: bash
        run: |
          suffix=""
          if [ "${{ runner.os }}" = "Windows" ]; then suffix=".exe"; fi
          go build -trimpath -buildvcs=true -o "enumscan${suffix}" ./cmd/enumscan
          "./enumscan${suffix}" -config configs/example.yaml help

  release-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          check-latest: true
      - run: make fmt-check vet test vulncheck reproducible
      - name: Build candidate image locally
        run: docker build --pull --tag enumscan:release-candidate .
      - name: Reject high or critical image vulnerabilities
        uses: anchore/scan-action@v7
        with:
          image: enumscan:release-candidate
          fail-build: true
          severity-cutoff: high

  publish:
    needs: [supported-platform-validation, release-security]
    runs-on: ubuntu-latest
    environment: production-release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Enforce approved publication policy
        env:
          APPROVED_CONTAINER_PUBLISH: ${{ vars.APPROVED_CONTAINER_PUBLISH }}
        run: test "$APPROVED_CONTAINER_PUBLISH" = "true"
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          check-latest: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: _frontend/package-lock.json
      - name: Verify deterministic offline dashboard bundle
        run: npm --prefix _frontend ci --ignore-scripts && npm --prefix _frontend run check
      - name: Install native package builders
        run: sudo apt-get update && sudo apt-get install --yes rpm
      - name: Rebuild deterministic release artifacts
        run: make reproducible build-cross release-archives system-packages verify-system-packages VERSION="${GITHUB_REF_NAME}" checksums
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          artifact-name: enumscan-sbom.cdx.json
          format: cyclonedx-json
          output-file: dist/enumscan-sbom.cdx.json
      - name: Attest binary build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/enumscan
            dist/enumscan-linux-amd64
            dist/enumscan-darwin-arm64
            dist/enumscan-windows-amd64.exe
            dist/enumscan-*.tar.gz
            dist/enumscan-*.zip
            dist/enumscan_*.deb
            dist/enumscan-*.rpm
            dist/enumscan-*-homebrew.rb
            dist/enumscan-*-scoop.json
            dist/enumscan-sha256sums.txt
            dist/enumscan-sbom.cdx.json
      - uses: sigstore/cosign-installer@v3
      - name: Keyless-sign release artifacts
        run: |
          for artifact in dist/enumscan dist/enumscan-linux-amd64 dist/enumscan-darwin-arm64 dist/enumscan-windows-amd64.exe dist/enumscan-*.tar.gz dist/enumscan-*.zip dist/enumscan_*.deb dist/enumscan-*.rpm dist/enumscan-*-homebrew.rb dist/enumscan-*-scoop.json dist/enumscan-sha256sums.txt dist/enumscan-sbom.cdx.json; do
            cosign sign-blob --yes --bundle "$artifact.bundle" "$artifact"
          done
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=sha
      - id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - name: Keyless-sign immutable image digest
        run: cosign sign --yes "ghcr.io/${{ github.repository }}@${{ steps.image.outputs.digest }}"
      - name: Attest container build provenance
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Publish signed GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/enumscan
            dist/enumscan.bundle
            dist/enumscan-linux-amd64
            dist/enumscan-linux-amd64.bundle
            dist/enumscan-darwin-arm64
            dist/enumscan-darwin-arm64.bundle
            dist/enumscan-windows-amd64.exe
            dist/enumscan-windows-amd64.exe.bundle
            dist/enumscan-*.tar.gz
            dist/enumscan-*.tar.gz.bundle
            dist/enumscan-*.zip
            dist/enumscan-*.zip.bundle
            dist/enumscan_*.deb
            dist/enumscan_*.deb.bundle
            dist/enumscan-*.rpm
            dist/enumscan-*.rpm.bundle
            dist/enumscan-*-homebrew.rb
            dist/enumscan-*-homebrew.rb.bundle
            dist/enumscan-*-scoop.json
            dist/enumscan-*-scoop.json.bundle
            dist/enumscan-sha256sums.txt
            dist/enumscan-sha256sums.txt.bundle
            dist/enumscan-sbom.cdx.json
            dist/enumscan-sbom.cdx.json.bundle

# Bounded unauthenticated web application discovery and analysis.
database:
  path: "data/REPLACE_web.sqlite"
scope:
  allowed_targets: ["REPLACE_WITH_AUTHORIZED_TARGET"]
  authorization: "REPLACE_WITH_WRITTEN_AUTHORIZATION_REFERENCE"
scheduler:
  concurrency: 4
  min_concurrency: 1
  global_rate_limit_ms: 150
  per_target_rate_limit_ms: 300
  module_timeout_ms: 25000
discovery:
  cidr_max_hosts: 64
  enable_dns_discovery: true
  enable_dns_records: true
  enable_reverse_dns: true
  enable_wildcard_dns: true
  enable_tcp_host_probes: true
  tcp_probe_ports: [80, 443, 8080, 8443]
portscan:
  profile: "web_application"
  tcp_ports: [80, 443, 8000, 8080, 8443, 8888, 9000, 9443, 3000, 5000]
  enable_tcp: true
  enable_banner: true
  max_concurrent_ports: 8
  base_timeout_ms: 750
  max_timeout_ms: 3000
http:
  max_depth: 3
  max_pages_per_host: 150
  enable_tls: true
  enable_crawler: true
  enable_js_analysis: true
  enable_api_discovery: true
  enable_directory_api: true
  max_directory_paths: 120
  directory_wordlist: []
  api_paths: ["/openapi.json", "/openapi.yaml", "/swagger.json", "/swagger/v1/swagger.json", "/api-docs", "/v1/api-docs", "/v2/api-docs", "/v3/api-docs", "/graphql", "/graphiql", "/api/v1", "/api/v2", "/api/v3", "/actuator", "/actuator/health", "/actuator/info", "/healthz", "/metrics"]
  enable_secret_intelligence: true
  enable_web_manifest: true
  enable_redirect_tracking: true
  enable_method_enumeration: true
  enable_source_map_analysis: true
  enable_cookie_jar: true
scan:
  profile: "web_application"
  targets: ["REPLACE_WITH_AUTHORIZED_TARGET"]



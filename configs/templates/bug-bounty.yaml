# Conservative in-program external surface discovery; verify program rules first.
database:
  path: "data/REPLACE_bugbounty.sqlite"
scope:
  allowed_targets: ["REPLACE_WITH_AUTHORIZED_TARGET"]
  authorization: "REPLACE_WITH_WRITTEN_AUTHORIZATION_REFERENCE"
scheduler:
  concurrency: 2
  min_concurrency: 1
  global_rate_limit_ms: 500
  per_target_rate_limit_ms: 1000
  module_timeout_ms: 30000
discovery:
  cidr_max_hosts: 64
  enable_dns_discovery: true
  enable_dns_records: true
  enable_wildcard_dns: true
  enable_rdap: false
http:
  max_depth: 2
  max_pages_per_host: 50
  enable_tls: true
  enable_crawler: true
  enable_js_analysis: true
  enable_api_discovery: true
  enable_directory_api: false
  enable_source_map_analysis: true
passive_intel:
  enabled: false
  sources: []
scan:
  profile: "bug_bounty"
  targets: ["REPLACE_WITH_AUTHORIZED_TARGET"]


# High-speed surface reconnaissance and top port discovery.
database:
  path: "data/REPLACE_quick.sqlite"
scope:
  allowed_targets: ["REPLACE_WITH_AUTHORIZED_TARGET"]
  authorization: "REPLACE_WITH_WRITTEN_AUTHORIZATION_REFERENCE"
scheduler:
  concurrency: 8
  min_concurrency: 2
  global_rate_limit_ms: 50
  per_target_rate_limit_ms: 100
  module_timeout_ms: 10000
discovery:
  cidr_max_hosts: 256
  enable_dns_discovery: true
  enable_dns_records: true
  enable_reverse_dns: true
  enable_tcp_host_probes: true
  tcp_probe_ports: [22, 80, 443, 8080]
portscan:
  profile: "quick"
  tcp_ports: [22, 80, 443, 8080]
  enable_tcp: true
  enable_banner: true
  max_concurrent_ports: 16
  base_timeout_ms: 500
  max_timeout_ms: 1500
http:
  max_depth: 1
  max_pages_per_host: 15
  enable_tls: true
  enable_crawler: true
  enable_js_analysis: false
  enable_api_discovery: false
  enable_directory_api: false
  enable_secret_intelligence: false
  enable_web_manifest: true
  enable_redirect_tracking: true
scan:
  profile: "quick"
  targets: ["REPLACE_WITH_AUTHORIZED_TARGET"]

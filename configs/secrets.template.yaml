# Production Vault example. The token is read from VAULT_TOKEN and is never
# persisted. Other providers and required fields are documented in README.md.
database:
  path: "data/enumscan-secrets.sqlite"
  encryption_key_secret: "enumscan/datastore-key"

secrets:
  provider: "hashicorp_vault"
  endpoint: "https://vault.example"
  token_env: "VAULT_TOKEN"
  token_file: ""
  mount: "secret"
  namespace: ""
  project: ""
  region: ""
  service: "enumscan"

scope:
  allowed_targets: ["REPLACE_WITH_AUTHORIZED_TARGET"]
  authorization: "REPLACE_WITH_WRITTEN_AUTHORIZATION_REFERENCE"

scan:
  targets: ["REPLACE_WITH_AUTHORIZED_TARGET"]

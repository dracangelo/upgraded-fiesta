database:
  path: "data/enumscan.sqlite"
  encryption_key_env: ""

neo4j:
  uri: ""
  username: ""
  password_env: "ENUMSCAN_NEO4J_PASSWORD"

scope:
  allowed_targets: ["127.0.0.1", "localhost"]
  authorization: "LOCAL-DEVELOPMENT-ONLY"

scheduler:
  concurrency: 1
  enable_adaptive_workers: false
  min_concurrency: 1
  global_rate_limit_ms: 100
  per_target_rate_limit_ms: 250
  module_timeout_ms: 10000

discovery:
  cidr_max_hosts: 256
  enable_dns_discovery: true
  enable_dns_records: true
  enable_reverse_dns: true
  enable_wildcard_dns: true
  enable_rdap: false
  # Active host checks are disabled until explicitly authorized.
  enable_icmp_sweep: false
  enable_tcp_host_probes: false
  tcp_probe_ports: [80, 443]
  enable_udp_live_probes: false
  udp_probe_ports: [53, 123]
  passive_dns_files: []
  certificate_transparency_files: []
  passive_capture_files: []

portscan:
  profile: "quick"
  tcp_ports: [80, 443, 2375, 2376, 5000, 5001, 6443, 8000, 8080, 8443, 10250, 10255]
  udp_ports: [53, 123, 161, 500, 1900]
  enable_tcp: true
  enable_udp: true
  enable_banner: true
  enable_raw_syn: false
  max_concurrent_ports: 8
  record_closed_ports: false
  base_timeout_ms: 750
  max_timeout_ms: 3000

http:
  max_depth: 1
  max_pages_per_host: 50
  enable_tls: true
  enable_crawler: true
  enable_js_analysis: true
  enable_api_discovery: true
  # A renderer command and output directory are required before enabling captures.
  enable_screenshots: false
  enable_directory_api: true
  enable_secret_intelligence: true
  enable_web_manifest: true
  enable_redirect_tracking: true
  enable_method_enumeration: true
  enable_source_map_analysis: true
  enable_cookie_jar: false
  enable_authenticated_crawling: false
  auth_cookie_env: ""
  enable_http3: false
  max_directory_paths: 80
  directory_wordlist: []
  api_paths: ["/openapi.json", "/swagger.json", "/swagger/v1/swagger.json", "/api-docs", "/graphql", "/grpc.reflection.v1alpha.ServerReflection/ServerReflectionInfo", "/soap?wsdl"]

specialized:
  # Read-only SSH/FTP/SMTP capability enumeration; no authentication attempts.
  enable_protocol_enumeration: true
  enable_smb: false
  enable_ldap: false
  enable_snmp: false
  enable_cloud: false
  enable_container: false
  enable_database: false
  snmp_communities: []

passive_intel:
  enabled: false
  # Add only provider sources explicitly authorized for this engagement.
  sources: []
  # Optional overrides can disable listed sources or enable centrally managed ones.
  provider_controls: [] # e.g. ["shodan=false", "github=true"]
  provider_versions: [] # e.g. ["github=2026-03-10"]
  enable_quota_discovery: false
  enable_update_checks: false
  provider_min_interval_ms: 1000
  max_retry_after_ms: 30000

scan:
  profile: "quick"
  targets: ["127.0.0.1"]
  ports: [80, 443, 2375, 2376, 5000, 5001, 6443, 8000, 8080, 8443, 10250, 10255]

reporting:
  output_dir: "reports"
  local_llm_url: ""
  local_llm_model: ""
  local_llm_timeout_ms: 30000

notifications:
  enable_scan_completed_webhook: false
  webhook_url: ""

api:
  require_auth: false
  tokens_env: "ENUMSCAN_API_TOKENS"

monitoring:
  enabled: false
  interval_minutes: 60
  max_runs: 1

database:
  path: "data/enumscan.sqlite"

scope:
  allowed_targets: ["127.0.0.1", "localhost"]

scheduler:
  concurrency: 4
  global_rate_limit_ms: 100
  per_target_rate_limit_ms: 250
  module_timeout_ms: 10000

discovery:
  cidr_max_hosts: 256
  enable_reverse_dns: true
  enable_wildcard_dns: true
  enable_rdap: false
  passive_dns_files: []
  certificate_transparency_files: []

portscan:
  profile: "quick"
  tcp_ports: [80, 443, 8000, 8080, 8443]
  udp_ports: [53, 123, 161, 500, 1900]
  enable_tcp: true
  enable_udp: true
  enable_banner: true
  enable_raw_syn: false
  base_timeout_ms: 750
  max_timeout_ms: 3000

scan:
  profile: "quick"
  targets: ["127.0.0.1"]
  ports: [80, 443, 8000, 8080, 8443]

reporting:
  output_dir: "reports"

# Copy to a private engagement file. This template is runnable but keeps every
# Tier 4 active technique disabled until the explicit gate below is completed.

database:
  path: "data/REPLACE_active-engagement.sqlite"
  encryption_key_env: "ENUMSCAN_DATASTORE_KEY"

scope:
  allowed_targets: ["REPLACE_WITH_AUTHORIZED_IP_OR_CIDR"]
  authorization: "REPLACE_WITH_WRITTEN_AUTHORIZATION_REFERENCE"

active_testing:
  enabled: false
  authorization_expires: ""
  operator: ""
  acknowledgement_env: ""
  allowed_techniques: []
  max_requests_per_host: 25
  max_concurrency: 1
  minimum_request_delay_ms: 500

scheduler:
  concurrency: 1
  enable_adaptive_workers: false
  min_concurrency: 1
  global_rate_limit_ms: 500
  per_target_rate_limit_ms: 1000
  module_timeout_ms: 15000

discovery:
  cidr_max_hosts: 64
  enable_dns_discovery: true
  enable_dns_records: true
  enable_reverse_dns: true
  enable_wildcard_dns: false
  enable_rdap: false
  enable_icmp_sweep: false
  enable_tcp_host_probes: true
  tcp_probe_ports: [22, 80, 443]
  enable_udp_live_probes: false
  udp_probe_ports: []
  passive_dns_files: []
  certificate_transparency_files: []
  passive_capture_files: []
  historical_url_files: []

portscan:
  profile: "quick"
  tcp_ports: []
  udp_ports: []
  enable_tcp: true
  enable_udp: false
  enable_banner: true
  enable_raw_syn: false
  enable_raw_scanning: false
  raw_techniques: []
  decoy_ips: []
  zombie_host: ""
  max_concurrent_ports: 4
  record_closed_ports: false
  base_timeout_ms: 750
  max_timeout_ms: 3000

http:
  max_depth: 1
  max_pages_per_host: 25
  enable_tls: true
  enable_crawler: true
  enable_js_analysis: true
  enable_api_discovery: true
  enable_screenshots: false
  enable_directory_api: false
  enable_secret_intelligence: false
  enable_web_manifest: true
  enable_redirect_tracking: true
  enable_method_enumeration: false
  enable_source_map_analysis: false
  enable_cookie_jar: false
  enable_authenticated_crawling: false
  auth_cookie_env: ""
  enable_http3: false
  enable_grpc_reflection: false
  grpc_reflection_ports: []
  max_directory_paths: 25
  directory_wordlist: []
  api_paths: []

specialized:
  enable_protocol_enumeration: true
  enable_smb: false
  enable_ldap: false
  enable_snmp: false
  enable_cloud: false
  enable_container: false
  enable_database: false
  snmp_communities: []

passive_intel:
  enabled: false
  sources: []
  provider_controls: []
  provider_versions: []
  enable_quota_discovery: false
  enable_update_checks: false
  provider_min_interval_ms: 1000
  max_retry_after_ms: 30000

scan:
  profile: "quick"
  targets: ["REPLACE_WITH_AUTHORIZED_IP_OR_CIDR"]
  ports: []

reporting:
  output_dir: "reports"

monitoring:
  enabled: false
  interval_minutes: 60
  max_runs: 1


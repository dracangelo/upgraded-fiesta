# Reference this from an engagement configuration with:
# scan:
#   custom_profile: "profiles/http-focused.example.yaml"
#
# Only the module families named here run. Explicit YAML settings in the main
# configuration still override these port and scheduler defaults.
name: "Focused HTTP Enumeration"
description: "Scoped web and API metadata enumeration over selected web ports"
modules:
  - discovery
  - portscan
  - service
  - http
ports:
  - 80
  - 443
  - 8080
  - 8443
concurrency: 12
timeout_sec: 90

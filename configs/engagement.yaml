# Generated by enumscan's engagement wizard. Review before use.
# This file is scope-locked: scan.targets must remain within scope.allowed_targets.
# Active testing, raw scans, decoys, and credentialed crawling are disabled.
database:
  driver: "sqlite"
  path: "data/enumscan.sqlite"
scope:
  allowed_targets: ["192.168.100.16"]
  authorization: "143-890-90"
scheduler:
  concurrency: 20
  min_concurrency: 1
  global_rate_limit_ms: 500
  per_target_rate_limit_ms: 1000
  module_timeout_ms: 60000
discovery:
  cidr_max_hosts: 256
  enable_dns_discovery: true
  enable_dns_records: true
  enable_reverse_dns: true
  enable_tcp_host_probes: true
  tcp_probe_ports: [80, 443]
portscan:
  profile: "standard"
  enable_tcp: true
  enable_udp: false
  enable_banner: true
  enable_raw_syn: false
  enable_raw_scanning: false
  max_concurrent_ports: 4
  base_timeout_ms: 750
  max_timeout_ms: 3000
http:
  max_depth: 1
  max_pages_per_host: 50
  enable_tls: true
  enable_crawler: true
  enable_js_analysis: true
  enable_api_discovery: true
  enable_screenshots: false
  enable_authenticated_crawling: false
scan:
  profile: "standard"
  targets: ["192.168.100.16"]
active_testing:
  enabled: false
api:
  require_auth: false
reporting:
  output_dir: "reports"

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>:root {
    --ink: #0A111F;
    --panel: #111C2E;
    --panel-2: #16233A;
    --panel-3: #1B2A44;
    --grid: #223252;
    --grid-soft: #1A2740;
    --brass: #C89B3C;
    --brass-soft: #8A6D2C;
    --brass-glow: rgba(200,155,60,0.18);
    --rust: #C4432B;
    --rust-glow: rgba(196,67,43,0.16);
    --amber: #D9922F;
    --teal: #4FA98A;
    --blue: #5B7FA6;
    --parchment: #E8E4D8;
    --muted: #8B98AD;
    --muted-2: #4C5A73;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'IBM Plex Sans', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }

  body.light-theme {
    --ink: #f0f4f8;
    --panel: #ffffff;
    --panel-2: #e6ecf5;
    --panel-3: #dbe4f0;
    --grid: #cbd5e1;
    --grid-soft: #e2e8f0;
    --brass: #b3822a;
    --brass-soft: #7a581a;
    --brass-glow: rgba(179,130,42,0.15);
    --rust: #a82e18;
    --rust-glow: rgba(168,46,24,0.12);
    --amber: #b8731d;
    --teal: #2f8566;
    --blue: #3b5f85;
    --parchment: #1a2333;
    --muted: #52637a;
    --muted-2: #8494ab;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    background:
      radial-gradient(ellipse at 15% 0%, rgba(200,155,60,0.05), transparent 45%),
      radial-gradient(ellipse at 85% 100%, rgba(91,127,166,0.06), transparent 50%),
      var(--ink);
    color: var(--parchment);
    font-family: var(--font-body);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  .chart-grid {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.012) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.012) 1px, transparent 1px);
    background-size: 28px 28px;
  }

  a { color: inherit; text-decoration: none; }
  button, input, select { font-family: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .visually-hidden {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }

  .skip-link {
    position: fixed; left: 12px; top: -60px; z-index: 100;
    padding: 9px 12px; background: var(--parchment); color: var(--ink);
    border-radius: 4px;
  }
  .skip-link:focus { top: 12px; }

  ::selection { background: var(--brass-glow); color: var(--parchment); }

  .shell {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-columns: 248px 1fr;
    grid-template-rows: 64px 1fr;
    grid-template-areas:
      "brand header"
      "nav main";
    min-height: 100vh;
  }

  .brand {
    grid-area: brand;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 22px;
    border-bottom: 1px solid var(--grid-soft);
    border-right: 1px solid var(--grid-soft);
    background: var(--panel);
  }
  .brand-mark {
    width: 26px; height: 26px;
    position: relative;
    flex-shrink: 0;
  }
  .brand-mark svg { width: 100%; height: 100%; }
  .brand-text {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 15.5px;
    letter-spacing: 0.02em;
    color: var(--parchment);
  }
  .brand-text span { color: var(--brass); }
  .brand-sub {
    font-family: var(--font-mono);
    font-size: 9.5px;
    color: var(--muted-2);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin-top: 1px;
  }

  .header {
    grid-area: header;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 26px;
    border-bottom: 1px solid var(--grid-soft);
    background: var(--panel);
    gap: 20px;
  }
  .target-block {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .target-name {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--parchment);
  }
  .target-name b { color: var(--brass); font-weight: 600; }
  .scan-input {
    width: 170px;
    color: var(--parchment);
    background: var(--panel-2);
    border: 1px solid var(--grid);
    border-radius: 3px;
    padding: 6px 9px;
    font: 11px var(--font-mono);
  }
  .scan-input:focus { outline: 1px solid var(--brass); border-color: var(--brass); }
  .scope-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--teal);
    border: 1px solid rgba(79,169,138,0.35);
    background: rgba(79,169,138,0.08);
    padding: 4px 9px;
    border-radius: 3px;
  }
  .scope-badge::before {
    content: '';
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--teal);
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .scan-status {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .radar {
    position: relative;
    width: 20px; height: 20px;
    border-radius: 50%;
    border: 1px solid var(--grid);
    background: var(--panel-2);
    overflow: hidden;
  }
  .radar::after {
    content: '';
    position: absolute;
    inset: 0;
    background: conic-gradient(from 0deg, var(--brass) 0deg, transparent 55deg, transparent 360deg);
    animation: sweep 2.6s linear infinite;
    opacity: 0.85;
  }
  .radar::before {
    content: '';
    position: absolute;
    inset: 6px;
    border-radius: 50%;
    background: var(--ink);
    z-index: 1;
  }
  @keyframes sweep { to { transform: rotate(360deg); } }
  .status-text { font-family: var(--font-mono); font-size: 11.5px; }
  .status-text .phase { color: var(--muted); }
  .status-text .n { color: var(--brass); font-weight: 600; }

  .profile-pill {
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    border: 1px solid var(--grid);
    padding: 5px 10px;
    border-radius: 3px;
    background: var(--panel-2);
  }
  .profile-pill b { color: var(--parchment); font-weight: 500; }

  .icon-btn {
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--grid);
    border-radius: 4px;
    background: var(--panel-2);
    color: var(--muted);
  }
  .icon-btn:hover { color: var(--brass); border-color: var(--brass-soft); }
  .icon-btn svg { width: 15px; height: 15px; }

  .card-more-button {
    border: 0; background: transparent; padding: 0; color: var(--muted);
    font: inherit; cursor: pointer;
  }
  .card-more-button:hover { color: var(--brass); }
  .table-row-button {
    color: inherit; background: transparent; border: 0; padding: 0;
    font: inherit; text-align: inherit; cursor: pointer;
  }
  .table-row-button:hover { color: var(--brass); }
  .dialog-backdrop {
    position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
    padding: 20px; background: rgba(0, 0, 0, 0.62);
  }
  .dialog-card {
    width: min(100%, 440px); background: var(--panel); border: 1px solid var(--grid);
    border-radius: 8px; box-shadow: 0 18px 48px rgba(0, 0, 0, 0.45); padding: 22px;
  }
  .dialog-card h2 { margin: 0 0 8px; font-size: 18px; }
  .dialog-card p { margin: 0 0 18px; color: var(--muted); }
  .dialog-card label { display: block; margin-bottom: 6px; color: var(--parchment); }
  .dialog-card input { width: 100%; }
  .dialog-card select { width: 100%; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
  .engagement-wizard { max-width: 600px; }
  .engagement-wizard label:not(:first-of-type) { margin-top: 14px; }
  .dialog-error { margin-top: 14px; color: var(--rust); font-weight: 600; }

  .avatar {
    width: 30px; height: 30px;
    border-radius: 4px;
    background: linear-gradient(135deg, var(--brass), var(--brass-soft));
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-weight: 600; font-size: 11px;
    color: var(--ink);
  }

  .nav {
    grid-area: nav;
    background: var(--panel);
    border-right: 1px solid var(--grid-soft);
    padding: 16px 12px;
    overflow-y: auto;
  }
  .nav-label {
    font-family: var(--font-mono);
    font-size: 9.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted-2);
    padding: 10px 10px 6px;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 10px;
    border-radius: 5px;
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 1px;
    border: 1px solid transparent;
    position: relative;
    cursor: pointer;
    background: transparent;
    width: 100%;
    text-align: left;
  }
  .nav-item:hover { background: var(--panel-2); color: var(--parchment); }
  .nav-item.active {
    background: var(--panel-3);
    color: var(--parchment);
    border-color: var(--grid);
  }
  .nav-item.active::before {
    content: '';
    position: absolute;
    left: -12px; top: 8px; bottom: 8px;
    width: 2px;
    background: var(--brass);
    border-radius: 2px;
  }
  .nav-phase {
    font-family: var(--font-mono);
    font-size: 9.5px;
    color: var(--muted-2);
    width: 16px;
  }
  .nav-item.active .nav-phase { color: var(--brass); }
  .nav-item svg { width: 15px; height: 15px; flex-shrink: 0; opacity: 0.85; }
  .nav-item span.label { flex: 1; }
  .nav-count {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--muted-2);
    background: var(--grid-soft);
    padding: 1px 6px;
    border-radius: 8px;
  }
  .nav-count.warn { color: var(--rust); background: var(--rust-glow); }
  .nav-divider {
    height: 1px;
    background: var(--grid-soft);
    margin: 10px 4px;
  }

  .main {
    grid-area: main;
    padding: 24px 28px 48px;
    overflow-y: auto;
    max-height: calc(100vh - 64px);
  }
  .view { animation: fadein 0.35s ease; }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  .view-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .view-title {
    font-family: var(--font-display);
    font-size: 21px;
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  .view-eyebrow {
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--brass);
    margin-bottom: 4px;
  }
  .view-desc { color: var(--muted); font-size: 13px; margin-top: 4px; max-width: 640px; }

  .btn {
    font-family: var(--font-mono);
    font-size: 11.5px;
    letter-spacing: 0.03em;
    padding: 7px 14px;
    border-radius: 4px;
    border: 1px solid var(--grid);
    background: var(--panel-2);
    color: var(--parchment);
    display: inline-flex;
    align-items: center;
    gap: 7px;
  }
  .btn:hover { border-color: var(--brass-soft); }
  .btn.primary {
    background: linear-gradient(180deg, var(--brass), var(--brass-soft));
    color: #14100A;
    border-color: transparent;
    font-weight: 600;
  }
  .btn svg { width: 13px; height: 13px; }

  .grid { display: grid; gap: 16px; }
  .grid.stats { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
  .grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
  .grid.cols-2 { grid-template-columns: 1.4fr 1fr; }
  .grid.cols-2b { grid-template-columns: 1fr 1fr; }

  .card {
    background: var(--panel);
    border: 1px solid var(--grid-soft);
    border-radius: 7px;
    padding: 18px;
  }
  .card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .card-title {
    font-family: var(--font-display);
    font-size: 13.5px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-title svg { width: 15px; height: 15px; color: var(--brass); }
  .card-more { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); }

  .stat-card { position: relative; overflow: hidden; }
  .stat-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .stat-value {
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 700;
    line-height: 1;
  }
  .stat-foot {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 10px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted-2);
  }
  .stat-foot.up { color: var(--teal); }
  .stat-foot.warn { color: var(--rust); }
  .stat-card.accent-rust .stat-value { color: var(--rust); }
  .stat-card.accent-amber .stat-value { color: var(--amber); }
  .stat-card.accent-brass .stat-value { color: var(--brass); }
  .stat-card.accent-teal .stat-value { color: var(--teal); }

  .pipeline {
    display: flex;
    align-items: flex-start;
    gap: 0;
    overflow-x: auto;
    padding-bottom: 4px;
  }
  .pl-step {
    flex: 0 0 auto;
    width: 120px;
    padding-right: 12px;
    position: relative;
  }
  .pl-step:not(:last-child)::after {
    content: '';
    position: absolute;
    top: 15px; right: 0;
    width: 12px; height: 1px;
    background: repeating-linear-gradient(90deg, var(--grid) 0 4px, transparent 4px 7px);
  }
  .pl-dot {
    width: 28px; height: 28px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-size: 11px; font-weight: 600;
    border: 1px solid var(--grid);
    background: var(--panel-2);
    color: var(--muted);
    margin-bottom: 8px;
  }
  .pl-step.done .pl-dot { background: rgba(79,169,138,0.12); border-color: rgba(79,169,138,0.4); color: var(--teal); }
  .pl-step.active .pl-dot { background: var(--brass-glow); border-color: var(--brass); color: var(--brass); box-shadow: 0 0 0 3px rgba(200,155,60,0.08); }
  .pl-name { font-size: 12px; color: var(--parchment); font-weight: 500; margin-bottom: 2px; }
  .pl-meta { font-family: var(--font-mono); font-size: 10px; color: var(--muted-2); }
  .pl-step.active .pl-meta { color: var(--brass); }

  .feed-row {
    display: grid;
    grid-template-columns: 66px 1fr auto;
    gap: 12px;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--grid-soft);
  }
  .feed-row:last-child { border-bottom: none; }
  .sev {
    font-family: var(--font-mono);
    font-size: 9.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    text-align: center;
    padding: 3px 0;
    border-radius: 3px;
    font-weight: 600;
  }
  .sev.critical { background: var(--rust-glow); color: var(--rust); }
  .sev.high { background: rgba(217,146,47,0.14); color: var(--amber); }
  .sev.medium { background: var(--brass-glow); color: var(--brass); }
  .sev.low { background: rgba(79,169,138,0.12); color: var(--teal); }
  .sev.info { background: rgba(91,127,166,0.14); color: var(--blue); }
  .feed-text { font-size: 12.5px; }
  .feed-text b { font-weight: 600; }
  .feed-sub { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted-2); margin-top: 2px; }
  .feed-time { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted-2); white-space: nowrap; }

  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--muted-2);
    padding: 0 12px 10px;
    border-bottom: 1px solid var(--grid-soft);
    font-weight: 500;
  }
  tbody td {
    padding: 11px 12px;
    border-bottom: 1px solid var(--grid-soft);
    font-size: 12.5px;
    vertical-align: middle;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--panel-2); }
  td.mono, .mono-cell { font-family: var(--font-mono); }
  .tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-family: var(--font-mono);
    font-size: 10.5px;
    padding: 2px 8px;
    border-radius: 3px;
    background: var(--panel-3);
    border: 1px solid var(--grid);
    color: var(--muted);
  }
  .tag.live { color: var(--teal); border-color: rgba(79,169,138,0.35); }
  .kev {
    font-family: var(--font-mono);
    font-size: 9.5px;
    color: var(--rust);
    border: 1px solid rgba(196,67,43,0.4);
    padding: 1px 6px;
    border-radius: 3px;
  }

  .method-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    padding: 6px 11px;
    border: 1px solid var(--grid);
    border-radius: 4px;
    background: var(--panel-2);
    color: var(--muted);
  }
  .method-chip.on { color: var(--parchment); border-color: var(--brass-soft); }
  .method-chip.on::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--teal); }
  .method-chip.off::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--muted-2); }
  .chip-wrap { display: flex; flex-wrap: wrap; gap: 8px; }

  .tech-chip {
    font-family: var(--font-mono);
    font-size: 11.5px;
    padding: 5px 10px;
    border-radius: 3px;
    background: var(--panel-3);
    border: 1px solid var(--grid);
    color: var(--parchment);
  }

  .course {
    position: relative;
    padding: 30px 6px 10px;
  }
  .course-line {
    position: absolute;
    top: 46px; left: 24px; right: 24px;
    height: 1px;
    background: repeating-linear-gradient(90deg, var(--brass-soft) 0 6px, transparent 6px 11px);
    z-index: 0;
  }
  .course-row {
    display: flex;
    justify-content: space-between;
    position: relative;
    z-index: 1;
  }
  .waypoint {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 108px;
    text-align: center;
  }
  .wp-dot {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--panel-2);
    border: 1.5px solid var(--grid);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 10px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
  }
  .waypoint.hit .wp-dot { border-color: var(--rust); color: var(--rust); background: var(--rust-glow); }
  .waypoint.warn .wp-dot { border-color: var(--amber); color: var(--amber); background: rgba(217,146,47,0.1); }
  .wp-name { font-size: 11.5px; font-weight: 500; color: var(--parchment); line-height: 1.3; }
  .wp-sub { font-family: var(--font-mono); font-size: 9.5px; color: var(--muted-2); margin-top: 3px; }

  .impact-banner {
    margin-top: 22px;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    border-radius: 6px;
    background: var(--rust-glow);
    border: 1px solid rgba(196,67,43,0.35);
  }
  .impact-banner svg { width: 20px; height: 20px; color: var(--rust); flex-shrink: 0; }
  .impact-title { font-size: 12.5px; font-weight: 600; color: var(--parchment); }
  .impact-sub { font-family: var(--font-mono); font-size: 11px; color: var(--muted); margin-top: 2px; }

  .graph-wrap {
    background:
      radial-gradient(ellipse at 50% 0%, rgba(200,155,60,0.05), transparent 60%),
      var(--panel);
    border: 1px solid var(--grid-soft);
    border-radius: 7px;
    padding: 10px;
    overflow-x: auto;
  }

  .report-card { display: flex; flex-direction: column; gap: 10px; }
  .report-icon {
    width: 34px; height: 34px;
    border-radius: 6px;
    background: var(--panel-3);
    border: 1px solid var(--grid);
    display: flex; align-items: center; justify-content: center;
    color: var(--brass);
  }
  .report-icon svg { width: 16px; height: 16px; }
  .report-name { font-family: var(--font-display); font-weight: 600; font-size: 14px; }
  .report-desc { font-size: 11.5px; color: var(--muted); }
  .report-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }

  .donut-wrap { display: flex; align-items: center; gap: 22px; }
  .donut {
    width: 110px; height: 110px;
    border-radius: 50%;
    background: conic-gradient(
      var(--rust) 0 16%,
      var(--amber) 16% 38%,
      var(--brass) 38% 72%,
      var(--teal) 72% 88%,
      var(--blue) 88% 100%
    );
    position: relative;
    flex-shrink: 0;
  }
  .donut::after {
    content: '';
    position: absolute;
    inset: 15px;
    border-radius: 50%;
    background: var(--panel);
  }
  .donut-center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 1;
    font-family: var(--font-display);
  }
  .donut-center b { font-size: 18px; }
  .donut-center span { font-family: var(--font-mono); font-size: 8.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .donut-container { position: relative; }
  .legend { display: flex; flex-direction: column; gap: 8px; }
  .legend-row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .legend-dot { width: 8px; height: 8px; border-radius: 2px; }
  .legend-row .cnt { margin-left: auto; font-family: var(--font-mono); color: var(--muted); }

  .scrollx { overflow-x: auto; scrollbar-color: var(--grid) var(--panel); }

  /* Desktop and tablet layouts: preserve the console hierarchy without
     collapsing dense evidence tables into a mobile-only presentation. */
  @media (max-width: 1180px) and (min-width: 700px) {
    .shell { grid-template-columns: 206px minmax(0, 1fr); }
    .grid.cols-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .main { padding: 22px; }
    .topbar { padding: 0 22px; }
    .view-head { gap: 14px; }
  }
  @media (min-width: 1500px) {
    .main { max-width: 1800px; margin: 0 auto; width: 100%; }
    table { font-size: 12.5px; }
  }
  .log-terminal {
    background: #050914;
    font-family: var(--font-mono);
    font-size: 11.5px;
    padding: 14px;
    border-radius: 6px;
    height: 320px;
    overflow-y: auto;
    color: #a0b2ce;
    border: 1px solid var(--grid);
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
  }
</style>
